# ~/.config/hypr/hypridle.conf
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Ce fichier est OBLIGATOIRE — hypridle refuse de demarrer sans lui.

general {
    lock_cmd         = pidof hyprlock || hyprlock  # evite plusieurs instances
    before_sleep_cmd = loginctl lock-session        # verrouiller avant suspend
    after_sleep_cmd  = hyprctl dispatch dpms on     # rallumer l ecran au retour
}

# 1. Avertissement 30s avant verrouillage
listener {
    timeout  = 270   # 4min30
    on-timeout = notify-send -u low -t 30000 "Verrouillage dans 30 secondes..."
}

# 2. Verrouillage ecran
listener {
    timeout    = 300  # 5 minutes
    on-timeout = loginctl lock-session
}

# 3. Extinction de l ecran
listener {
    timeout    = 600  # 10 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 4. Mise en veille systeme
listener {
    timeout    = 1800  # 30 minutes
    on-timeout = systemctl suspend
}
