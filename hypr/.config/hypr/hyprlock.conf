# ~/.config/hypr/hyprlock.conf
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
}

# Fond — capture + flou de l ecran courant
background {
    path         = screenshot
    blur_passes  = 2
    blur_size    = 7
    brightness   = 0.5
}

# Heure — centree en haut
label {
    monitor  =
    text     = cmd[update:1000] echo "$(date +"%H:%M")"
    color    = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    halign   = center
    valign   = center
    position = 0, 100
}

# Date
label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A %d %B %Y")"
    color    = rgba(255, 255, 255, 0.6)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    halign   = center
    valign   = center
    position = 0, 20
}

# Champ de saisie du mot de passe
input-field {
    monitor          =
    size             = 300, 50
    outline_thickness = 2
    dots_size        = 0.25
    dots_spacing     = 0.15
    outer_color      = rgb(2b1d4b)
    inner_color      = rgba(0, 0, 0, 0.5)
    font_color       = rgb(ffffff)
    fade_on_empty    = true
    placeholder_text = <i>Mot de passe...</i>
    fail_text        = <b>Echec ($ATTEMPTS)</b>
    halign           = center
    valign           = center
    position         = 0, -80
}
