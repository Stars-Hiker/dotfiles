#################
### AUTOSTART ###
#################

# Wallpaper
#exec-once = swww-daemon

# Lance la rotation au démarrage (remplace tout exec swww-daemon existant)
exec-once = ~/.config/hypr/scripts/wallpaper.sh

# Barre de statut
exec-once = waybar

# Polkit agent (ecosysteme natif Hypr)
# Remplace polkit-kde-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent

# Idle daemon — verrouillage + veille automatique
# Necessite ~/.config/hypr/hypridle.conf
exec-once = hypridle

# Daemon de notifications
exec-once = swaync

# Filtre lumiere bleue (4500K = ton chaud)
exec-once = hyprsunset -t 4500

# Clipboard manager
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Loading setup

# Workspace 1
exec-once = [workspace 1] kitty
exec-once = [workspace 1] firefox "https://github.com" "https://claude.ai/new" "https://gemini.google.com"

