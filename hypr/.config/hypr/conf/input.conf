#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    numlock_by_default = true
    kb_layout          = fr
    # kb_options       = caps:escape   # ex: CapsLock -> Echap (preference perso)

    repeat_rate  = 40   # touches repetees par seconde
    repeat_delay = 300  # delai (ms) avant repetition

    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

# Gestures — nouvelle syntaxe depuis Hyprland 0.51
# Le bloc gestures {} (workspace_swipe_*) est supprime ; tout passe par "gesture ="
gesture = 3, horizontal, workspace
