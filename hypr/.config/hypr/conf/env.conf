#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Theme du curseur — decommente et adapte au theme voulu (ls /usr/share/icons)
# env = XCURSOR_THEME,breeze_cursors

# Requis pour le partage d ecran (Discord, OBS, Zoom...)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Backends applicatifs — Wayland natif avec repli X11
# (rendu plus net, HiDPI correct, moins de flou sur XWayland)
env = MOZ_ENABLE_WAYLAND,1                       # Firefox / Zen en natif Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto          # apps Electron en natif Wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1       # pas de double bordure sur Qt
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
