##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/
# Syntaxe pour Hyprland >= 0.53 : match: en premier, puis la regle avec valeur explicite

# Ignorer les requetes de maximize des applications
windowrule {
    name = no_maximize
    suppress_event = maximize
    match:class = .*
}

# Fix glitches de drag avec XWayland
windowrule {
    name = xwayland_no_focus
    no_focus = on
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = true
    match:fullscreen = false
    match:pin = false
}

# Rofi — desactiver les animations pour un lancement instantane
windowrule = no_anim on, match:class ^(rofi)$

# Rofi — flottant centre
windowrule = float on,  match:class ^(rofi)$
windowrule = center on, match:class ^(rofi)$

# wlogout — toujours en plein ecran
windowrule = fullscreen on, match:class ^(wlogout)$

# Dialogues systeme — flottants
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save File)$
windowrule = float on, match:title ^(Confirm)$
