###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER


# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
bind = $mainMod,       Return, exec, $terminal
bind = $mainMod,       E,      exec, $fileManager
bind = $mainMod,       B,      exec, $browser
bind = $mainMod,       R,      exec, $menu
bind = $mainMod,       L,      exec, $logout
bind = $mainMod,       X,      exec, $lock
bind = $mainMod,       D,      exec, $menu
bind = $mainMod,       Escape, exec, ~/.config/rofi/scripts/powermenu.sh


# ---------------------------------------------------------------------------
# Gestion des fenetres
# ---------------------------------------------------------------------------
bind = $mainMod,       C,      killactive
bind = $mainMod,       F,      fullscreen
bind = $mainMod,       V,      togglefloating
bind = $mainMod,       P,      pseudo          # dwindle pseudotile
bind = $mainMod,       J,      togglesplit     # dwindle split direction
bind = $mainMod SHIFT, P,      pin             # epingler sur tous les workspaces
bind = $mainMod,       Tab,    workspace, previous

# Wallpaper suivant manuellement — adapte le bind à ta guise
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh next

# Deplacement du focus — fleches
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Deplacer une fenetre — SHIFT + fleches
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d


# ---------------------------------------------------------------------------
# Redimensionnement — submap propre (SUPER+Z pour entrer, ESC pour sortir)
# ---------------------------------------------------------------------------
bind = $mainMod, Z, submap, resize
submap = resize
binde = , right, resizeactive,  30  0
binde = , left,  resizeactive, -30  0
binde = , up,    resizeactive,   0 -30
binde = , down,  resizeactive,   0  30
bind  = , escape, submap, reset
bind  = $mainMod, Z, submap, reset
submap = reset


# ---------------------------------------------------------------------------
# Utilitaires
# ---------------------------------------------------------------------------
bind = $mainMod,       A,      exec, killall -SIGUSR1 waybar   # toggle waybar
bind = $mainMod SHIFT, V,      exec, $clipboard                # cliphist
bind = $mainMod SHIFT, N,      exec, swaync-client -t          # panel notifs


# ---------------------------------------------------------------------------
# Screenshots — hyprshot
# ---------------------------------------------------------------------------
bind = ,               PRINT,  exec, hyprshot -m output   # moniteur entier
bind = $mainMod,       PRINT,  exec, hyprshot -m window   # fenetre active
bind = SHIFT,          PRINT,  exec, hyprshot -m region   # selection zone


# ---------------------------------------------------------------------------
# Hyprexpo — vue grille des workspaces (necessite le plugin hyprexpo)
# ---------------------------------------------------------------------------
#bind = $mainMod, grave, hyprexpo:expo, toggle


# ---------------------------------------------------------------------------
# Workspaces — navigation
# ---------------------------------------------------------------------------
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Workspaces — deplacer la fenetre active
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Scratchpad (workspace special)
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# Scroll entre workspaces avec la molette souris
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1


# ---------------------------------------------------------------------------
# Souris — deplacer et redimensionner les fenetres
# ---------------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ---------------------------------------------------------------------------
# Touches multimedia — volume (PipeWire / WirePlumber)
# ---------------------------------------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Luminosite ecran — brightnessctl
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Controle media — playerctl
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous
